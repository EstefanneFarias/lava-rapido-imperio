
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar serviço</title>

    <link rel="stylesheet" href="{{ url_for('static',filename='css/style.css')}}">

</head>
<body>


<header>
    <h1>Lava-Rápido Império</h1>
    <p>Registrar serviço</p>
</header>

<main>
    <a href="{{ url_for('inicio') }}">Voltar</a>

    <h2>Novo serviço</h2>

    
<form>
    <label for="veiculo">Nome do veículo:</label>
    <input type="text" id="veiculo" name="veiculo" required>

    <label for="placa">Placa do veículo:</label>
    <input type="text" id="placa" name="placa">

    <label for="valor">Valor do serviço (R$)</label>
<input type="number" id="valor" name="valor" min="0" step="0.01" required>

<label for="pagamento">Forma de pagamento</label>
<select id="pagamento" name="pagamento" required>
   <option value="">Selecione</option>
   <option value="dinheiro">Dinheiro</option>
    <option value="cartao">Cartão</option>

</select>

<label for="caixinha">Caixinha (gorjeta) - R$:</label>
<input type="number" id="caixinha" name="caixinha" min="0" step="0.01" value="0">


<button type="submit">Registrar serviço</button>


</form>

</main>

</body>

</html>
