
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lava-Rápido Império</title>
    <link rel="stylesheet" href="{{ url_for('static', filename= 'css/style.css') }}">

</head>
<body>

    <header>
        <h1>Lava-Rápido Império</h1>
        <p>Sistema de controle</p>
    </header>

    <main>
         <!-- Conteúdo principal da página -->

        <section>
            <!-- Seção que apresenta o resumo do dia -->

            <h2>Resumo do dia</h2>

   <div class="resumo-cards">

    <div class="card">
        <h3>Serviços realizados</h3>
        <p>{{ quantidade_servicos }}</p>
    </div>

    <div class="card">
        <h3>Total recebido</h3>
        <p>R$ {{ '%.2f'|format(total_recebido / 100)|replace('.', ',') }}</p>
    </div>

</div>

        </section>

        <section>
            <h2>Operações</h2>

            <div class="botoes-operacoes">

            <a href="{{ url_for('registrar_servico') }}" class="botao">
    Registrar serviço
           </a>

           <a href="{{ url_for('registrar_despesas') }}" class="botao">
    Registrar despesas
           </a>

           <a href="{{ url_for('historico_servicos') }}" class="botao">
    Histórico de serviços
         </a>

           <a href="{{ url_for('fechamento_diario') }}" class="botao">
    Fechamento diário
           </a>
            </div>

        </section>

    </main>


</body>
</html>
